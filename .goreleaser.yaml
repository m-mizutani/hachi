version: 2

builds:
  - env:
      - CGO_ENABLED=0
    # Windows is not supported: commands are stopped through Unix process groups.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: >-
      {{ .ProjectName }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: "checksums.txt"

release:
  # Created as a draft so that the assets can be reviewed before publishing.
  draft: true

changelog:
  use: github-native
